[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-sanmar"
version = "0.1.0"
description = "Class 2 SanMar SME agent for the Knoxville AI platform"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "agent-core>=0.2.0",
    # PDF parsing for sanmar_parse_po_pdf.
    "pypdf>=4.0",
    # SFTP access for sanmar_lookup_mainframe_color and the
    # mainframe-color auto-resolve fallback (ftp.sanmar.com:2200).
    "paramiko>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skills*"]
