[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Rename to `sme-<your-saas>` (e.g. `sme-salesforce`) when forking this
# template. The console matches `source_repo` to `knoxville-ai/<repo>`,
# not to this name, so it's purely cosmetic — but keep it in sync with
# the repo name and the role slug for sanity.
name = "sme-template"
version = "0.1.0"
description = "Class 2 SME agent template for the Knoxville AI platform"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "agent-core>=0.2.0",
    # PDF parsing for sanmar_parse_po_pdf.
    "pypdf>=4.0",
    # SFTP access for sanmar_lookup_mainframe_color and the
    # mainframe-color auto-resolve fallback (ftp.sanmar.com:2200).
    "paramiko>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skills*"]
