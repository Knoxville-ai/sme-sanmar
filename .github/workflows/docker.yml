# Build and publish this SME's Docker image to GHCR.
#
# Triggers:
#   - push of a v* tag (release)  → tags :vX.Y.Z + :latest
#   - push to the default branch → tags :edge + :latest
#   - manual run via workflow_dispatch (also used by agent-core's
#     dispatch-smes fan-out workflow when agent-core publishes a new tag)
#
# After a successful main-branch build (i.e. one that updates :latest),
# pings the console's /api/internal/sme-rebuilt webhook so every active
# agent using this image gets an automatic Railway redeploy. Tag-only
# builds skip the ping because :latest doesn't move.
#
# The image name is derived from `github.repository`, so a fork/clone of
# this template named `knoxville-ai/sme-foo` automatically publishes to
# `ghcr.io/knoxville-ai/sme-foo` with no edits to this file.

name: docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,suffix=-edge
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # linux/amd64 only — Railway's build fleet is amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify console (auto-redeploy Railway services)
        # Only fire on main-branch builds (or workflow_dispatch on main from
        # the agent-core fan-out). Tag pushes don't update :latest, so
        # there's nothing for Railway services pinned to :latest to pick up.
        if: github.ref == 'refs/heads/main' && success()
        env:
          WEBHOOK_URL: ${{ secrets.SME_REBUILD_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.SME_REBUILD_WEBHOOK_SECRET }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          if [[ -z "${WEBHOOK_URL}" || -z "${WEBHOOK_SECRET}" ]]; then
            echo "::warning::SME_REBUILD_WEBHOOK_URL or _SECRET not set; skipping redeploy notification."
            exit 0
          fi
          # The console looks up every active agent with source_repo matching
          # this repo and calls Railway's serviceInstanceDeploy on each.
          response=$(curl -fsS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "{\"source_repo\":\"${SOURCE_REPO}\"}" \
            -w "\n%{http_code}" \
            || echo "CURL_FAILED")
          if [[ "${response}" == "CURL_FAILED" ]]; then
            echo "::warning::Console webhook unreachable; redeploy will need to be done manually."
            exit 0
          fi
          echo "Console response: ${response}"
